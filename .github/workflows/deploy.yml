# Deploys main to SiteGround (https://fellowshiplaw.notstaging.dev/) over SSH.
# Required repo secrets: SG_SSH_KEY, SG_HOST, SG_USER, SG_PORT, SG_PATH (see README).
name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-siteground

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SG_PORT }} -H ${{ secrets.SG_HOST }} >> ~/.ssh/known_hosts

      # --delete mirrors the repo, removing server files that aren't in it.
      # SiteGround's own .htaccess and .well-known (SSL) are left alone.
      # Add --dry-run to the rsync flags for a first run to preview the file list.
      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            --exclude '.git*' --exclude '.github' --exclude 'README.md' \
            --exclude '.htaccess' --exclude '.well-known' \
            -e "ssh -p ${{ secrets.SG_PORT }}" \
            ./ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_PATH }}"

      # Merge the repo's .htaccess block into the server's .htaccess, keeping
      # any rules SiteGround (or anyone else) added outside the block.
      - name: Merge .htaccess rules
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          REMOTE="$SG_USER@$SG_HOST"
          ssh -p "$SG_PORT" "$REMOTE" "cat '${SG_PATH}.htaccess' 2>/dev/null || true" > server.htaccess
          sed '/^# BEGIN fellowship-law-html$/,/^# END fellowship-law-html$/d' server.htaccess | sed '/./,$!d' > rest.htaccess
          { cat .htaccess; echo; cat rest.htaccess; } > merged.htaccess
          rsync -e "ssh -p $SG_PORT" merged.htaccess "$REMOTE:${SG_PATH}.htaccess"
